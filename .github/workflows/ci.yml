name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    # gitleaks over the FULL git history (all commits reachable from this ref), not just HEAD.
    # Pinned binary + checksum instead of gitleaks-action (no license key, no third-party action).
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full history
        run: "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .

  check:
    runs-on: ubuntu-latest
    env:
      # Fakes only: no credentials, no network calls to model providers.
      LLM_PROVIDER: fake
      EMBEDDINGS_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - run: uv sync --frozen
      - run: make lint # ruff check + ruff format --check + mypy --strict
      - run: make test # pytest (offline fakes)
      - run: make eval

  smoke:
    # docker compose (API + n8n) end to end with the offline fake LLM/embeddings. No secrets.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: scripts/smoke.sh
