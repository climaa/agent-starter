name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Fakes only: no credentials, no network calls to model providers.
      LLM_PROVIDER: fake
      EMBEDDINGS_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - run: uv sync --frozen
      - run: make lint
      - run: make test
      - run: make eval
