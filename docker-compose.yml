services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      TICKET_WEBHOOK_URL: http://n8n:5678/webhook/ticket
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-}   # same value n8n sends as X-Webhook-Token
      # Mount ~/.aws read-only to use your local profile with Bedrock:
      # AWS_PROFILE: default
    # volumes: ["~/.aws:/home/app/.aws:ro"]

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}  # pin a version for real use
    ports: ["5678:5678"]
    environment:
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"   # workflow reads N8N_WEBHOOK_TOKEN
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-}
      GENERIC_TIMEZONE: Europe/Madrid
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro   # import + publish: see README "n8n" (scripts/smoke.sh does both)

volumes:
  n8n_data:
